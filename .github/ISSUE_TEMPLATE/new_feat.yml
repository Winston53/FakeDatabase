name: Feature Request
description: Request a new table, stored procedure, column, or CI improvement
title: "[FEAT] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe what you want to add and why.

  - type: dropdown
    id: database
    attributes:
      label: Which database?
      options:
        - FakeRetailDB
        - CustomerDB
        - InventoryDB
        - OrdersDB
        - All databases
        - Other
    validations:
      required: true

  - type: dropdown
    id: change-type
    attributes:
      label: What type of change?
      options:
        - New table
        - New stored procedure
        - New column on existing table
        - Modify existing object
        - New index / constraint
        - CI/CD workflow improvement
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Describe the feature
      placeholder: |
        Example: Add a ReorderLevel column to Products table 
        so we can flag low stock automatically.
    validations:
      required: true

  - type: textarea
    id: proposed-schema
    attributes:
      label: Proposed schema or code
      description: Paste the SQL or workflow code you plan to add
      render: sql

  - type: dropdown
    id: data-loss
    attributes:
      label: Does this affect existing data?
      options:
        - No — new object only
        - Yes — new column (nullable, no data loss)
        - Yes — requires data migration
        - Yes — drops an existing object
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have tested this locally with dotnet build
          required: false
        - label: This change is approved by the team lead
          required: false