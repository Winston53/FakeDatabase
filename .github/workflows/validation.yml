name: Validate Database Build

on:
  pull_request:
    branches: [main]
    paths:
      - 'FakeRetailDB/**'
  workflow_dispatch:
    

jobs:
  build:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Lint SQL (TSQLLint)
        shell: powershell
        run: tsqllint FakeRetailDB/
        
      - name: Build .dacpac
        run: dotnet build FakeRetailDB/FakeRetailDB.sqlproj --configuration Release